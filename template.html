<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 작업 지도</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e3e1db; --accent:#3b5bdb;
  --c-read:#2f7d6d; --c-edit:#c2410c; --c-run:#475569; --c-test:#7c3aed; --c-web:#0369a1;
  --c-agent:#b45309; --c-plan:#4d7c0f; --c-ask:#be185d; --c-share:#0e7490; --c-git:#9f1239; --c-other:#8a8780;
  --err:#dc2626;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161615; --panel:#1f1f1d; --ink:#ecebe7; --muted:#9c9a93; --line:#33322f; --accent:#8da2fb;
  --c-read:#5fbfa9; --c-edit:#fb8c4f; --c-run:#94a3b8; --c-test:#b39dfa; --c-web:#4fb3e8;
  --c-agent:#f0b04a; --c-plan:#9bd04a; --c-ask:#f472b6; --c-share:#3cc6dc; --c-git:#fb7190; --c-other:#a8a69f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12px}
select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);padding:14px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
main{padding:20px 24px 60px;min-width:0}
.scard{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.scard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scard b{display:block;font-size:13px;line-height:1.35}
.scard small{color:var(--muted)}
.minibar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.tabs{display:flex;gap:4px;margin:4px 0 18px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;margin:26px 0 10px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted)}
.bigbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* 도형 타임라인 */
.flow{position:relative;padding-left:4px}
.node{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;margin-bottom:0}
.node .rail{display:flex;flex-direction:column;align-items:center}
.node .dot{width:30px;height:30px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex:none}
.node .stem{flex:1;width:2px;background:var(--line);min-height:16px}
.node .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
.node .box:hover{border-color:var(--accent)}
.node.on .box{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.box .q{font-weight:600;white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:hidden}
.box .r{color:var(--muted);margin-top:6px;font-size:13px;white-space:pre-wrap;max-height:4.6em;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.err{color:var(--err)}
.meta{font-size:11.5px;color:var(--muted);margin-top:6px}
/* 상세 */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:4px}
.mwrap{overflow:auto;border:1px dashed var(--line);border-radius:10px;padding:12px;background:var(--bg);max-height:78vh}
.mwrap svg{max-width:none!important;height:auto}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:12px;color:var(--muted);margin:10px 0}
.shapes span{display:flex;align-items:center;gap:8px}
.shapes svg{flex:none}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mem .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--accent)}
.mem .card[data-t=feedback]{border-top-color:var(--c-ask)} .mem .card[data-t=project]{border-top-color:var(--c-agent)} .mem .card[data-t=reference]{border-top-color:var(--c-web)}
.mem .card b{display:block} .mem .card p{margin:6px 0 0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.files{columns:2 260px;font-size:12.5px;color:var(--muted);padding-left:18px}
.empty{color:var(--muted);padding:30px;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 업데이트 · 설정 · AI 해설 */
.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.ver{font-size:12px;color:var(--muted)}
#banner .bn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-bottom:1px solid var(--line)}
#banner .bn b{font-weight:650}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.primary:hover{filter:brightness(1.08)}
#settings{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sbox h4{margin:0 0 8px;font-size:14px}
.prov{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.prov:first-of-type{border-top:none}
.prov .nm{flex:1}
.ok{color:var(--c-plan)} .no{color:var(--muted)}
.aibox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0 4px;border-left:4px solid var(--c-agent)}
.aibox .md h2{font-size:15px;margin:16px 0 6px} .aibox .md h2:first-child{margin-top:4px}
.aibox .md ul{margin:4px 0;padding-left:20px} .aibox .md p{margin:4px 0}
.aibox .md .mwrap{max-height:none}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
/* AI 도형 해설 */
.aisum{font-size:17px;font-weight:700;margin:8px 0 6px}
.stleg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.dirrow{display:flex;align-items:center;gap:0;margin-top:6px;flex-wrap:wrap}
.dbox{border:2px solid var(--line);border-radius:12px;padding:8px 14px;min-width:140px;background:var(--bg)}
.dbox.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.dbox small{display:block;color:var(--muted);font-size:11px}
.darrow{flex:1;min-width:150px;display:flex;flex-direction:column;align-items:center;padding:0 8px;color:var(--muted);font-size:12px}
.darrow i{display:block;width:100%;height:2px;background:var(--muted);position:relative;margin:4px 0}
.darrow i:after{content:'';position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--muted)}
.darrow.chg{color:var(--c-ask)} .darrow.chg i{background:var(--c-ask)} .darrow.chg i:after{border-left-color:var(--c-ask)}
.phases{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0;margin-top:4px}
.ph{position:relative;width:150px;min-height:118px;border:2px solid var(--line);border-radius:14px;padding:10px 10px 8px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.ph b{font-size:13px;line-height:1.3} .ph span{font-size:12px;color:var(--muted);line-height:1.35}
.ph small{font-size:10.5px;color:var(--muted)} .ph em{font-style:normal;font-size:11px;margin-top:auto;padding-top:4px}
.ph .phi{font-size:20px;line-height:1}
.ph .phn{position:absolute;top:-9px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid currentColor;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph.s-done{border-color:var(--c-plan);color:var(--c-plan)} .ph.s-done b{color:var(--ink)}
.ph.s-doing{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)} .ph.s-doing b{color:var(--ink)}
.ph.s-failed{border-color:var(--err);color:var(--err);background:color-mix(in srgb,var(--err) 8%,var(--panel))} .ph.s-failed b{color:var(--ink)}
.ph.s-todo{border-style:dashed;border-color:var(--muted);color:var(--muted)}
.ph.goal{border-color:var(--accent);border-radius:999px;width:auto;min-width:120px;min-height:0;padding:12px 18px;align-items:center;text-align:center}
.pha{width:28px;text-align:center;color:var(--muted);font-size:16px} .pha.dash{opacity:.45}
.nexts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;margin-top:6px}
.nx{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--accent);border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px}
.nx.first{border-style:solid;background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.nx i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.nexts .pha{width:22px}
/* 🎬 작업 현장 */
.scene{position:relative;aspect-ratio:900/430;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:radial-gradient(circle,var(--line) 1px,transparent 1.2px) 0 0/22px 22px,var(--panel)}
.scene svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.st{position:absolute;transform:translate(-50%,-50%);width:13%;min-width:74px;text-align:center;border:2px solid var(--cc);border-radius:14px;
  background:color-mix(in srgb,var(--cc) 10%,var(--panel));padding:6px 4px 5px;transition:box-shadow .3s,background .3s}
.st .si{font-size:clamp(16px,2.4vw,26px);line-height:1.1}
.st .sl{font-size:clamp(9px,1.1vw,12px);font-weight:600;color:var(--ink)}
.st .sc{position:absolute;top:-9px;right:-9px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--cc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.st.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 35%,transparent);background:color-mix(in srgb,var(--cc) 24%,var(--panel))}
.st.bad{border-color:var(--err);box-shadow:0 0 0 4px color-mix(in srgb,var(--err) 30%,transparent)}
.st.user{--cc:var(--accent);border-radius:50%;width:9%;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center}
.st .sc[hidden]{display:none}
.bot{position:absolute;transform:translate(-50%,-112%);transition:left .7s cubic-bezier(.5,0,.3,1),top .7s cubic-bezier(.5,0,.3,1),transform .7s;z-index:3;width:clamp(34px,5vw,54px)}
.bot svg{width:100%;display:block;animation:bob 1.1s ease-in-out infinite}
.bot.idle svg{animation:none}
.bot .ant{animation:blinkc 1s steps(2) infinite}
.bot.idle .ant{animation:none}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blinkc{50%{fill:var(--c-agent)}}
.bubble{position:absolute;bottom:105%;left:50%;transform:translateX(-50%);width:max-content;max-width:min(300px,40vw);background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;
  padding:5px 10px;font-size:clamp(10px,1.2vw,12.5px);line-height:1.35;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:normal}
.bubble:after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.bot.down{transform:translate(-50%,40%)}
.bot.down .bubble{bottom:auto;top:105%}
.bot.down .name{top:auto;bottom:100%}
.bot.down .bubble:after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
.bot.edge-r .bubble{left:auto;right:-30%;transform:none} .bot.edge-r .bubble:after{left:auto;right:18px}
.bot.edge-l .bubble{left:-30%;transform:none} .bot.edge-l .bubble:after{left:18px}
.bubble.err{border-color:var(--err);color:var(--err)}
.minibot{position:absolute;transform:translate(-50%,-50%);z-index:2;text-align:center;font-size:10px;width:90px;color:var(--muted);transition:opacity .4s}
.minibot svg{width:28px;animation:bob 1.3s ease-in-out infinite}
.sctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.sctl input[type=range]{flex:1;min-width:160px}
.sctl select{max-width:340px}
.livepill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,#e03131 14%,var(--panel));color:#e03131;font-weight:700}
/* 방향 나침반 */
.src{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);vertical-align:middle}
h2 .src{font-size:12px;margin-right:4px;vertical-align:3px}
.live{color:#e03131;font-weight:700;animation:blink 1.6s infinite}
.botb{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 45%,transparent);background:color-mix(in srgb,var(--bc) 10%,var(--panel));vertical-align:middle;margin-right:4px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:10px}
.bcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--bc);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:center}
.bcard:hover{border-color:var(--bc)}
.bcard svg{width:44px;display:block;grid-row:span 2}
.bcard b{font-size:14.5px}
.bcard small{color:var(--muted);font-size:12px}
.bcard .now{grid-column:1/-1;font-size:12.5px;color:var(--ink);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .minibar{grid-column:1/-1}
.bot .name{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--bc);background:var(--panel);border:1px solid var(--bc);border-radius:999px;padding:0 6px}
@keyframes blink{50%{opacity:.35}}
.compass{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0 4px;border-left:4px solid var(--accent)}
.ctitle{font-weight:700;font-size:15px}
.sent{margin:6px 0 12px}
.path{display:flex;align-items:stretch;overflow-x:auto;padding:16px 0 4px;gap:0}
.chev{position:relative;flex:0 0 auto;min-width:108px;max-width:150px;padding:8px 22px 8px 26px;background:color-mix(in srgb,var(--cc) 16%,var(--panel));border-top:2px solid var(--cc);border-bottom:2px solid var(--cc);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-right:-8px;opacity:.6}
.chev:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-left:12px}
.chev:nth-last-child(-n+4){opacity:.85} .chev.now{opacity:1;background:color-mix(in srgb,var(--cc) 30%,var(--panel))}
.chev b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev small{color:var(--muted);font-size:11px;white-space:nowrap}
.chev .pv{position:absolute;top:-1px;left:22px;font-size:10px;color:var(--c-ask);font-weight:700}
.path .goal{align-self:center;font-size:22px;padding-left:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}
.cbody{font-size:13px;margin-top:3px;white-space:pre-wrap}
.plan{margin:4px 0 0;padding-left:20px;font-size:12.5px;color:var(--muted)}
/* 🤝 MyCollaboBot */
.modes{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{border:none;border-radius:0;background:none;padding:6px 12px;color:var(--muted)}
.modes button.on{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--ink);font-weight:650}
.pbadge[hidden]{display:none}
.pbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--c-ask);color:#fff;font-size:11px;font-weight:700;text-align:center;animation:blink 1.6s infinite}
#approvals .ap{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:10px 20px;background:color-mix(in srgb,var(--c-ask) 10%,var(--panel));border-bottom:1px solid var(--line);border-left:5px solid var(--c-ask)}
#approvals .ap svg{width:44px;display:block}
#approvals .ap b{font-size:14px} #approvals .ap .what{font-size:13px;margin-top:2px}
#approvals .ap pre{grid-column:2/-1;margin:4px 0 0;max-height:140px;overflow:auto;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-all}
#approvals .ap textarea{width:100%;min-height:44px}
.okb{background:var(--c-plan);border-color:var(--c-plan);color:#fff} .nob{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,var(--line))}
textarea,input.f,select.f{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea:focus,input.f:focus{outline:none;border-color:var(--accent)}
.bl{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--bc);border-radius:10px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.bl.on{box-shadow:0 0 0 1px var(--bc);border-color:var(--bc)}
.bl svg{width:38px;grid-row:span 2;display:block}
.bl b{font-size:13.5px} .bl small{color:var(--muted);font-size:11.5px}
.bl.st-running svg,.bl.st-waiting svg{animation:bob 1.1s ease-in-out infinite}
.stt{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid currentColor}
.stt.running{color:var(--accent)} .stt.waiting{color:var(--c-ask)} .stt.done{color:var(--c-plan)} .stt.error{color:var(--err)} .stt.stopped{color:var(--muted)} .stt.idle{color:var(--muted)}
.bhead{display:flex;gap:14px;align-items:center}
.bhead svg{width:64px;flex:none}
.taskbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.taskbox textarea{min-height:70px}
.form{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}

.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:6px;cursor:pointer}

.sbox:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--bc) 35%,transparent)}

<body>
<header>
  <h1>🗺️ AI 작업 지도</h1>
  <span class="modes" id="modes"><button data-m="map" class="on">🗺️ 작업 지도</button><button data-m="bots">🤝 MyCollaboBot <span class="pbadge" id="pbadge" hidden></span></button></span>
  <select id="proj" aria-label="프로젝트"></select>
  <span class="sub" id="gen"></span>
  <span class="hright" id="hright"></span>
</header>
<div id="banner"></div>
<div id="approvals"></div>
<div id="settings" hidden></div>
<div class="layout">
  <aside id="list"></aside>
  <main id="main"><div class="empty">세션을 선택하세요.</div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
let DATA = /*__DATA__*/null;
const LIVE = DATA === 'LIVE';
const TOKEN = /*__TOKEN__*/'';
const CATS = {
  read:{ko:'읽기·조사',ico:'🔍'}, edit:{ko:'파일 수정',ico:'✏️'}, run:{ko:'명령 실행',ico:'⚙️'},
  test:{ko:'테스트',ico:'🧪'}, web:{ko:'웹·브라우저',ico:'🌐'}, agent:{ko:'에이전트',ico:'🤖'},
  plan:{ko:'계획',ico:'📋'}, ask:{ko:'질문',ico:'❓'}, share:{ko:'결과 공유',ico:'📤'},
  git:{ko:'커밋·배포',ico:'📦'}, other:{ko:'기타 도구',ico:'🧩'}
};
const ORDER = Object.keys(CATS);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col = c => `var(--c-${c})`;
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const dur = (a,b) => { if(!a||!b) return ''; const m=Math.round((new Date(b)-new Date(a))/60000); return m<1?'1분 미만':m<60?`${m}분`:`${Math.floor(m/60)}시간 ${m%60}분`; };

function counts(steps){ const c={}; steps.forEach(s=>c[s.cat]=(c[s.cat]||0)+1); return c; }
function sessCounts(s){ const c={}; s.turns.forEach(t=>t.steps.forEach(x=>c[x.cat]=(c[x.cat]||0)+1)); return c; }
function bar(c, cls='minibar'){
  const tot = Object.values(c).reduce((a,b)=>a+b,0) || 1;
  return `<div class="${cls}">` + ORDER.filter(k=>c[k]).map(k=>`<span title="${CATS[k].ko} ${c[k]}" style="width:${c[k]/tot*100}%;background:${col(k)}"></span>`).join('') + '</div>';
}
function chips(c, steps){
  const errs = steps ? steps.filter(s=>s.error).length : 0;
  return '<div class="chips">' + ORDER.filter(k=>c[k]).map(k=>`<span class="chip" style="color:${col(k)}">${CATS[k].ico} ${CATS[k].ko} ${c[k]}</span>`).join('')
    + (errs ? `<span class="chip err">⚠ 오류 ${errs}</span>` : '') + '</div>';
}

let P = 0, S = null, TAB = 'scene', T = null;

/* ── 봇 팀(MyCollaboBot·MausBot): 봇마다 정해진 색, 이름표 ── */
const BOT_COLORS = ['--c-agent','--c-read','--c-test','--c-web','--c-ask','--c-plan','--c-share','--c-edit','--c-git'];
// 모든 봇 이름을 가나다순으로 세워 차례로 색을 준다 → 봇끼리 색이 겹치지 않고, 어느 화면에서나 같은 색
let BOT_IDX = {key:null, map:{}};
const botColorVar = name => {
  const names = [...new Set([...(DATA&&DATA.projects||[]).flatMap(p=>p.sessions.filter(s=>s.bot).map(s=>s.bot.name)), ...(CB?CB.bots.map(b=>b.name):[])])].sort();
  const key = names.join('\n');
  if(BOT_IDX.key!==key) BOT_IDX = {key, map:Object.fromEntries(names.map((n,i)=>[n,BOT_COLORS[i%BOT_COLORS.length]]))};
  return BOT_IDX.map[name] || BOT_COLORS[0];
};
const botBadge = s => s.bot ? `<span class="botb" style="--bc:var(${botColorVar(s.bot.name)})">🤖 ${h(s.bot.name)}</span>` : '';
function teamOf(p){
  const bots = {};
  p.sessions.forEach((s,i)=>{ if(!s.bot) return; const b = bots[s.bot.name] ||= {name:s.bot.name, idx:[], counts:{}, last:'', live:false, now:''};
    b.idx.push(i); Object.entries(sessCounts(s)).forEach(([k,v])=>b.counts[k]=(b.counts[k]||0)+v);
    if((s.end||'')>b.last){ b.last=s.end||''; const t=s.turns[s.turns.length-1]; b.now=t?(t.recap||t.reply||t.prompt):''; }
    if(isActive(s)) b.live=true; });
  return Object.values(bots).sort((a,b)=>b.last.localeCompare(a.last));
}
function teamHTML(p){
  const team = teamOf(p); if(!team.length) return '';
  return `<h3>🤖 봇 팀 <span class="sub" style="color:var(--muted);font-weight:400">봇 ${team.length}명 · 누르면 그 봇의 최근 대화</span></h3>
    <div class="team">${team.map(b=>`<div class="bcard" data-i="${b.idx[0]}" style="--bc:var(${botColorVar(b.name)})">${botSVG(css(botColorVar(b.name)))}
      <b>${b.live?'<span class="live">●</span> ':''}${h(b.name)}</b><small>대화 ${b.idx.length}개 · ${b.live?'지금 작업 중':fmt(b.last)}</small>
      <div class="now">${h(cut(b.now,60))}</div>${bar(b.counts)}</div>`).join('')}</div>`;
}

const SRC_ICO = l => l.startsWith('WSL') ? '🐧' : l==='Mac' ? '🍎' : l==='Windows' ? '🪟' : '💻';
const srcBadge = p => p.source ? `<span class="src">${SRC_ICO(p.source)} ${h(p.source)}${p.machine?' · '+h(p.machine):''}</span> ` : '';
function projOptions(){ return DATA.projects.map((p,i)=>`<option value="${i}">${p.source&&!p.team?SRC_ICO(p.source)+' ':''}${h(p.name)} (${p.sessions.length})</option>`).join(''); }
function genLine(){
  const srcs = (DATA.sources||[]).map(s=>`<span class="src" title="마지막 수집 ${h(s.updated)}">${SRC_ICO(s.label)} ${h(s.label)}${s.machine?' · '+h(s.machine):''}</span>`).join(' ');
  return (DATA.demo ? '<span class="src" style="color:var(--c-agent)">예시 데이터</span> ' : '') + (LIVE ? '<span class="live">● 실시간</span> ' : '') + `갱신 ${h(DATA.generated)} · 프로젝트 ${DATA.projects.length}개 ${srcs}`;
}
function init(){
  $('#gen').innerHTML = genLine();
  $('#proj').innerHTML = projOptions();
  $('#proj').value = P;
  $('#proj').onchange = e => { P=+e.target.value; S=null; renderList(); renderMain(); };
  renderList(); renderMain();
}

/* ── 실시간: 기록이 바뀌면 선택 상태를 유지한 채 다시 그린다 ── */
let VER = 0;
async function refresh(first){
  const v = +(await (await fetch('/version')).text());
  if(v === VER) return;
  const old = first ? null : DATA.projects[P];
  const pName = old && old.key;
  const sId = old && S!==null && old.sessions[S] ? old.sessions[S].id : null;
  DATA = await (await fetch('/data.json')).json(); VER = v;
  if(first){
    // 처음 열 때는 가장 최근에 움직인 세션을 보여 준다
    P = 0; S = DATA.projects[0] && DATA.projects[0].sessions.length ? 0 : null;
    let best = '';
    DATA.projects.forEach((p,i)=>p.sessions.forEach((s,j)=>{ if((s.end||'')>best){best=s.end;P=i;S=j;} }));
  } else {
    const pi = DATA.projects.findIndex(p=>p.key===pName); P = pi<0?0:pi;
    const si = sId ? DATA.projects[P].sessions.findIndex(s=>s.id===sId) : -1; S = si<0?null:si;
  }
  if(first) applyHash();
  // 보고 있는 화면이 실제로 바뀐 경우에만 다시 그린다 (클릭·스크롤이 끊기지 않게)
  const p = DATA.projects[P];
  const listKey = JSON.stringify(DATA.projects.map(x=>[x.key,x.sessions.length])) + JSON.stringify(p.sessions.map(x=>[x.id,x.end,x.turns.length,isActive(x)]));
  const mainKey = JSON.stringify(S===null ? [p.memory, p.sessions.map(x=>[x.id,x.end])] : p.sessions[S]);
  $('#gen').innerHTML = genLine();
  if(MODE!=='map' && !first){ LAST = {list:null, main:null}; return; }
  if(first || listKey!==LAST.list){ if(first) init(); else { $('#proj').innerHTML = projOptions(); $('#proj').value=P; renderList(); } }
  if(!first && mainKey!==LAST.main){ const y=scrollY; renderMain(); scrollTo(0,y); }
  LAST = {list:listKey, main:mainKey};
}
let LAST = {};
// 바로가기 주소: #p=프로젝트번호&s=세션번호&t=요청번호&tab=flow|chart|files&settings=1
function applyHash(){
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if(q.p!==undefined && DATA.projects[+q.p]){ P=+q.p; S=null; }
  if(q.s!==undefined && DATA.projects[P].sessions[+q.s]) S=+q.s;
  if(q.tab) TAB=q.tab;
  if(q.t!==undefined) T=+q.t-1;
  if(q.mode==='bots') setTimeout(()=>{ CBSEL=q.bot||null; CBRUN=q.run||null; CBNEW=!!q.new; CBTEAM=q.team||null; JOBOPEN=q.job||null; setMode('bots'); }, 0);
  if(q.settings) setTimeout(()=>{ $('#settings').hidden=false; loadAIState(); }, 300);
  if(q.update && DATA.demo) setTimeout(()=>{ UPD={current:'0.1.0',latest:'0.2.0',available:true,mode:'zip',url:'#',checked:new Date().toISOString(),
    notes:'- 팀즈 알림 지원\n- AI 해설에 다음 할 일 우선순위 표시\n- 윈도우 설치 속도 개선'}; renderUpdate(); renderSettings(); if(q.notes) $('#notes').click(); }, 1500);
}
const isActive = s => s.end && (Date.now() - new Date(s.end)) < 10*60*1000;

/* ── 방향 나침반: 최근 요청에서 내가 어느 쪽으로 가고 있는지 ── */
const STOP = new Set('부탁해 부탁 만들고 만들어 만들어줘 해줄래 어디 어디에 이건 그건 저건 그리고 그럼 그러면 이거 그거 저거 이것 그것 지금 이제 일단 우선 다시 계속 혹시 정말 아주 너무 많이 이렇게 그렇게 어떻게 어떤 무슨 왜 뭐 좀 것 수 등 때 더 잘 안 못 다 또 한번 하나 해줘 해주세요 해봐 해 하자 하고 싶다 싶어 싶은 있어 없어 있는 없는 있다 없다 같은 같아 같다 되는 되어 되면 된다 했어 했는데 하는 하면 해서 확인 확인해줘 부탁 내가 너가 니가 네가 우리 여기 거기 저기 the and to of for in on is it this that with a an be are please can you do'.split(' '));
const VERBISH = /(싶다|싶어|싶은|싶고|겠다|겠고|겠어|으면|있으면|합니다|해요|했다|했어|한다|된다|하다|좋다|좋아|좋겠|줄수|할수|볼수|는데|었는데|았는데|어줘|아줘|해봐|이다|입니다|네요|군요|하지|하게|되게)$/;
const SUFFIX = /(으로는|에서는|에게|까지|부터|해줘요|해줘|해주세요|하고|하는|해서|했는데|합니다|이랑|으로|에서|처럼|보다|이라|라는|은|는|이|가|을|를|에|의|로|와|과|도|만|요)$/;
function keywords(text){
  const out=[];
  (String(text).toLowerCase().match(/[a-z0-9][a-z0-9._+-]*[a-z0-9]|[가-힣]+/g)||[]).forEach(w=>{
    if(/[가-힣]/.test(w)){
      if(VERBISH.test(w)) return;   // 서술어(…싶다, …좋겠고)는 주제가 아니다
      w = w.replace(SUFFIX,'');
    }
    if(w.length>=2 && !STOP.has(w) && !/^\d+$/.test(w)) out.push(w);
  });
  return out;
}
function dominant(steps){ const c=counts(steps); const k=ORDER.filter(k=>c[k] && k!=='plan').sort((a,b)=>c[b]-c[a])[0]; return k||'other'; }
function directionHTML(turns){
  turns = turns.filter(t=>t.prompt && t.prompt!=='(이어서 진행)');
  if(!turns.length) return '';
  const recent = turns.slice(-6), earlier = turns.slice(-36,-6);
  const freq = arr => { const m={}; arr.forEach(t=>new Set(keywords(t.prompt)).forEach(k=>m[k]=(m[k]||0)+1)); return m; };
  const fr = freq(recent), fe = freq(earlier);
  const rising = Object.keys(fr).map(k=>({k, score: fr[k]/recent.length - (fe[k]||0)/Math.max(earlier.length,1), isNew: !fe[k], n: fr[k]}))
    .sort((a,b)=>b.score-a.score || b.n-a.n).slice(0,6);
  // 작업 성격 변화
  const cr = {}; recent.forEach(t=>t.steps.forEach(s=>cr[s.cat]=(cr[s.cat]||0)+1));
  const mainCats = ORDER.filter(k=>cr[k] && k!=='plan').sort((a,b)=>cr[b]-cr[a]).slice(0,2);
  // 경로 (최근 8개 요청)
  const path = turns.slice(-8);
  const base = turns.length - path.length;
  const chevs = path.map((t,i)=>{
    const ks = keywords(t.prompt); const set = new Set(ks);
    // 직전 3개 요청과 주제어가 하나도 겹치지 않으면 '방향 전환'으로 본다
    const before = new Set(turns.slice(Math.max(0,base+i-3), base+i).flatMap(x=>keywords(x.prompt)));
    const pivot = set.size>=2 && before.size>=3 && ![...set].some(x=>before.has(x));
    const top = ks.sort((a,b)=>(fr[b]||0)-(fr[a]||0))[0] || cut(t.prompt,10);
    const d = dominant(t.steps);
    const last = i===path.length-1;
    return `<div class="chev ${last?'now':''}" style="--cc:${col(d)}" title="${h(t.prompt)}">
      ${pivot?'<span class="pv">↪ 방향 전환</span>':''}<b>${h(top)}</b><small>${CATS[d].ico} ${fmt(t.start)}</small></div>`;
  }).join('');
  const lastT = turns[turns.length-1];
  const words = rising.slice(0,3).map(r=>`‘${h(r.k)}’`).join(', ');
  const sentence = `최근 요청 ${recent.length}개는 ${words||'여러 주제'} 쪽으로 가고 있습니다.` + (mainCats.length ? ` AI는 주로 <b>${mainCats.map(k=>CATS[k].ko).join('·')}</b> 작업을 하고 있습니다.` : '');
  return `<div class="compass">
    <div class="ctitle">🧭 지금 가고 있는 방향</div>
    <p class="sent">${sentence}</p>
    <div class="path">${chevs}<div class="goal">🎯</div></div>
    <div class="cgrid">
      <div><div class="tag">지금 목표 (마지막 요청)</div><div class="cbody">👤 ${h(cut(lastT.prompt,160))}</div></div>
      <div><div class="tag">AI가 마지막으로 보고한 것</div><div class="cbody">🤖 ${h(cut(lastT.recap||lastT.reply||'아직 진행 중…',200))}</div></div>
      <div><div class="tag">떠오르는 주제</div><div class="chips">${rising.map(r=>`<span class="chip" style="color:var(--accent)">${r.isNew?'🆕':'▲'} ${h(r.k)}</span>`).join('')||'—'}</div>
        ${lastT.plan&&lastT.plan.length?`<div class="tag" style="margin-top:8px">현재 계획</div><ol class="plan">${lastT.plan.map(p=>`<li>${h(p)}</li>`).join('')}</ol>`:''}</div>
    </div></div>`;
}

/* ── 🎬 작업 현장: 2D 에이전트가 작업 공간을 오가며 지금 하는 일을 보여 준다 ── */
const STATIONS = {
  user:{x:7,y:50,ko:'사용자',ico:'👤'},
  plan:{x:24,y:20}, read:{x:43,y:20}, web:{x:62,y:20}, share:{x:81,y:20},
  edit:{x:24,y:80}, run:{x:43,y:80}, test:{x:62,y:80}, git:{x:81,y:80},
  agent:{x:93,y:50}, ask:{x:7,y:14}, other:{x:7,y:86}
};
const STN_KO = {plan:'계획 보드',read:'자료실',web:'웹·브라우저',share:'결과 공유',edit:'작업대',run:'기계실',test:'시험대',git:'출하장',agent:'협업실',ask:'질문하기',other:'도구함'};
function botSVG(color, size){
  return `<svg viewBox="0 0 60 64" aria-hidden="true">
    <ellipse cx="30" cy="61" rx="16" ry="3" fill="#000" opacity=".12"/>
    <line x1="30" y1="4" x2="30" y2="12" stroke="${color}" stroke-width="3"/><circle class="ant" cx="30" cy="4" r="4" fill="${color}"/>
    <rect x="10" y="12" width="40" height="28" rx="10" fill="${color}"/>
    <rect x="16" y="18" width="28" height="15" rx="6" fill="#fff"/>
    <circle cx="24" cy="25.5" r="3.2" fill="#1d1d1b"/><circle cx="36" cy="25.5" r="3.2" fill="#1d1d1b"/>
    <rect x="17" y="42" width="26" height="15" rx="6" fill="${color}" opacity=".85"/>
    <rect x="4" y="44" width="10" height="5" rx="2.5" fill="${color}"/><rect x="46" y="44" width="10" height="5" rx="2.5" fill="${color}"/>
  </svg>`;
}
function sceneSeq(t, isLive){
  const seq = [{st:'user', text:'📨 요청 받음: '+t.prompt}];
  t.steps.forEach(x=>{ if(x.cat==='plan' && !STATIONS[x.cat]) return;
    seq.push({st: STATIONS[x.cat]?x.cat:'other', text:`${(CATS[x.cat]||CATS.other).ico} ${(CATS[x.cat]||CATS.other).ko}: ${x.detail||x.tool}`, error:x.error, sub:x.sub}); });
  if(!isLive) seq.push({st:'user', done:true, text: t.interrupted ? '⏹ 사용자가 중단함' : '✅ 보고: '+(t.recap||t.reply||'끝')});
  return seq;
}
let SC = {sid:null, turn:null, k:0, playing:false, speed:1, timer:null, follow:true};
function renderScene(s){
  clearTimeout(SC.timer);
  const last = s.turns.length-1, live = isActive(s);
  if(SC.sid!==s.id){ SC = {sid:s.id, turn:last, k:Infinity, playing:false, speed:1, timer:null, follow:true}; }
  if(SC.follow) SC.turn = last;
  const t = s.turns[SC.turn]; if(!t){ $('#tab').innerHTML='<div class="empty">기록이 없습니다.</div>'; return; }
  const isLive = live && SC.turn===last;
  const seq = sceneSeq(t, isLive);
  if(SC.k===Infinity || (SC.follow && isLive)) SC.k = seq.length-1;
  SC.k = Math.min(SC.k, seq.length-1);
  const used = new Set(['user', ...seq.map(x=>x.st)]);
  const stations = Object.entries(STATIONS).filter(([k])=>used.has(k) || ['plan','read','edit','run','test','web'].includes(k));
  $('#tab').innerHTML = `
    <div class="sctl">
      <select id="scturn" aria-label="요청 고르기">${s.turns.map((x,i)=>`<option value="${i}" ${i===SC.turn?'selected':''}>요청 ${i+1}. ${h(cut(x.prompt,40))}</option>`).join('')}</select>
      ${isLive?'<span class="livepill">● 지금 작업 중 — 실시간으로 따라갑니다</span>':''}
    </div>
    <div class="scene" id="scene">
      <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="trail" fill="none" stroke="${css('--accent')}" stroke-width="0.5" stroke-dasharray="1.2 1.2" vector-effect="non-scaling-stroke" opacity=".6"/></svg>
      ${stations.map(([k,v])=>`<div class="st ${k==='user'?'user':''}" id="st-${k}" style="left:${v.x}%;top:${v.y}%;--cc:${k==='user'?'var(--accent)':col(k)}">
        <div class="si">${k==='user'?'👤':(CATS[k]||CATS.other).ico}</div><div class="sl">${k==='user'?'사용자':STN_KO[k]}</div><span class="sc" hidden></span></div>`).join('')}
      <div id="minis"></div>
      <div class="bot" id="bot" ${s.bot?`style="--bc:var(${botColorVar(s.bot.name)})"`:''}>${botSVG(css(s.bot?botColorVar(s.bot.name):'--c-agent'))}${s.bot?`<div class="name">${h(s.bot.name)}</div>`:''}<div class="bubble" id="bubble"></div></div>
    </div>
    <div class="sctl">
      <button id="scplay">${SC.playing?'⏸ 멈춤':'▶ 처음부터 재생'}</button>
      <button id="scprev" title="이전 단계">⏮</button><button id="scnext" title="다음 단계">⏭</button>
      <input type="range" id="scrange" min="0" max="${seq.length-1}" value="${SC.k}" aria-label="단계">
      <span class="sub" id="sck"></span>
      <select id="scspeed" aria-label="속도">${[1,3,10].map(v=>`<option value="${v}" ${SC.speed===v?'selected':''}>${v}배속</option>`).join('')}</select>
    </div>
    <div class="sub">로봇이 AI 에이전트입니다. 일하는 곳을 옮겨 다니며 무엇을 하는지 말풍선으로 보여 줍니다. 숫자는 그 곳에서 한 일의 횟수, 빨간 테두리는 오류, 작은 로봇은 일을 나눠 맡은 서브에이전트입니다.</div>`;
  const place = (k, instant) => {
    SC.k = k; const x = seq[k]; const p = STATIONS[x.st];
    const bot = $('#bot'); if(!bot) return;
    if(instant){ bot.style.transition='none'; }
    bot.style.left = p.x+'%'; bot.style.top = p.y+'%';
    bot.classList.toggle('down', p.y < 40);
    bot.classList.toggle('edge-r', p.x > 75); bot.classList.toggle('edge-l', p.x < 20);   // 위쪽 줄에서는 작업대 아래에 서서 말풍선도 아래로
    if(instant){ bot.offsetWidth; bot.style.transition=''; }
    bot.classList.toggle('idle', !!x.done || (!isLive && k===seq.length-1));
    const b = $('#bubble'); b.textContent = cut(x.text, 110); b.className = 'bubble'+(x.error?' err':'');
    if(x.error) b.textContent = '❗ ' + b.textContent + ' — 오류';
    // 횟수 · 강조 · 지나온 길
    const cnt = {}, bad = new Set();
    seq.slice(1,k+1).forEach(y=>{ if(!y.done){ cnt[y.st]=(cnt[y.st]||0)+1; if(y.error) bad.add(y.st); } });
    document.querySelectorAll('#scene .st').forEach(el=>{
      const key = el.id.slice(3), c = el.querySelector('.sc');
      el.classList.toggle('on', key===x.st); el.classList.toggle('bad', bad.has(key));
      if(cnt[key]){ c.hidden=false; c.textContent=cnt[key]; } else c.hidden=true;
    });
    const pts = seq.slice(Math.max(0,k-6),k+1).map(y=>`${STATIONS[y.st].x},${STATIONS[y.st].y}`).join(' ');
    $('#trail').setAttribute('points', pts);
    // 서브에이전트: 맡긴 시점부터 협업실 옆에 작은 로봇으로
    const subs = seq.slice(0,k+1).filter(y=>y.sub);
    $('#minis').innerHTML = subs.slice(-3).map((y,i)=>{ const c=y.sub.tools||{}; const sc=ORDER.filter(q=>c[q]).map(q=>`${CATS[q].ico}${c[q]}`).join(' ');
      return `<div class="minibot" style="left:${70-i*13}%;top:50%">${botSVG(css('--c-read'))}<div><b>${h(cut(y.sub.desc,24))}</b><br>${sc}${y.sub.finished?' ✔':''}</div></div>`; }).join('');
    $('#scrange').value = k; $('#sck').textContent = `단계 ${k+1} / ${seq.length}`;
  };
  const stop = () => { clearTimeout(SC.timer); SC.playing=false; const b=$('#scplay'); if(b) b.textContent='▶ 처음부터 재생'; };
  const tick = () => { if(!SC.playing) return; if(SC.k >= seq.length-1){ stop(); return; } place(SC.k+1); SC.timer = setTimeout(tick, 900/SC.speed); };
  $('#scplay').onclick = () => { if(SC.playing){ stop(); return; } SC.follow=false; SC.playing=true; $('#scplay').textContent='⏸ 멈춤'; place(0,true); SC.timer=setTimeout(tick, 900/SC.speed); };
  $('#scprev').onclick = () => { stop(); SC.follow=false; place(Math.max(0,SC.k-1)); };
  $('#scnext').onclick = () => { stop(); place(Math.min(seq.length-1,SC.k+1)); };
  $('#scrange').oninput = e => { stop(); SC.follow=false; place(+e.target.value); };
  $('#scspeed').onchange = e => { SC.speed=+e.target.value; };
  $('#scturn').onchange = e => { stop(); SC.turn=+e.target.value; SC.follow = SC.turn===last; SC.k=Infinity; renderScene(s); };
  // 실시간: 새 단계가 생겼으면 이전 위치에서 새 위치로 걸어가게
  const prevK = SC.prevK!=null && SC.prevSeq===SC.turn ? SC.prevK : null;
  if(prevK!=null && prevK < SC.k){ const target=SC.k; place(prevK,true); setTimeout(()=>place(target), 60); }
  else place(SC.k, true);
  SC.prevK = SC.k; SC.prevSeq = SC.turn;
  if(SC.playing){ SC.timer=setTimeout(tick, 900/SC.speed); }
}

/* ── Mermaid ───────────────────────────── */
const esc = s => String(s ?? '').replace(/["`<>#]/g,' ').replace(/[\[\]{}|]/g,' ').replace(/\s+/g,' ').trim();
const cut = (s,n) => { s = esc(s); return s.length>n ? s.slice(0,n)+'…' : s; };
const wrap = (s,w=28) => { const out=[]; let line=''; for(const ch of s){ line+=ch; if(line.length>=w && /\s/.test(ch)){ out.push(line.trim()); line=''; } else if(line.length>=w+8){ out.push(line); line=''; } } if(line) out.push(line.trim()); return out.join('<br/>'); };
const SHAPE = { read:['[/','/]'], edit:['[',']'], run:['[[',']]'], test:['[[',']]'], web:['{{','}}'], agent:['[[',']]'],
  plan:['[\\','\\]'], ask:['{','}'], share:['>',']'], git:['[(',')]'], other:['(',')'] };

function classDefs(){
  const lines = ORDER.map(k=>{ const c=css('--c-'+k); return `classDef ${k} fill:${c}22,stroke:${c},color:${css('--ink')},stroke-width:1.5px`; });
  lines.push(`classDef start fill:${css('--accent')}22,stroke:${css('--accent')},color:${css('--ink')},stroke-width:2px`);
  lines.push(`classDef done fill:${css('--c-plan')}1f,stroke:${css('--c-plan')},color:${css('--ink')},stroke-width:2px`);
  lines.push(`classDef err stroke:${css('--err')},stroke-width:3px`);
  return lines.join('\n');
}

function groupSteps(steps){
  const g=[];
  for(const st of steps){
    const last=g[g.length-1];
    if(last && last.cat===st.cat && st.cat!=='agent' && st.cat!=='ask'){ last.items.push(st); }
    else g.push({cat:st.cat, items:[st]});
  }
  return g;
}

function turnMermaid(t){
  const L = ['flowchart TD', classDefs()];
  L.push(`U(["👤 요청<br/>${wrap(cut(t.prompt,120))}"]):::start`);
  let prev='U';
  if(t.plan && t.plan.length){
    L.push(`PL[\\"📋 계획<br/>${t.plan.slice(0,8).map((p,i)=>`${i+1}) ${cut(p,36)}`).join('<br/>')}"\\]:::plan`);
    L.push(`${prev} --> PL`); prev='PL';
  }
  const groups = groupSteps(t.steps.filter(s=>s.cat!=='plan'));
  const MAX=45; const shown = groups.slice(0,MAX);
  shown.forEach((g,i)=>{
    const id='G'+i, [a,b]=SHAPE[g.cat]||SHAPE.other, cat=CATS[g.cat]||CATS.other;
    const ds=[...new Set(g.items.map(x=>cut(x.detail,40)).filter(Boolean))];
    let label = `${cat.ico} ${cat.ko}${g.items.length>1?' ×'+g.items.length:''}`;
    if(ds.length) label += '<br/>' + ds.slice(0,3).join('<br/>') + (ds.length>3?`<br/>외 ${ds.length-3}개`:'');
    const err = g.items.some(x=>x.error);
    L.push(`${id}${a}"${label}"${b}:::${g.cat}${err?'\nclass '+id+' err':''}`);
    L.push(`${prev} --> ${id}`);
    const sub = g.items[0].sub;
    if(g.cat==='agent' && sub){
      const c=sub.tools||{}; const sc=ORDER.filter(k=>c[k]).map(k=>`${CATS[k].ico}${c[k]}`).join(' ');
      L.push(`subgraph SA${i}["🤖 ${cut(sub.type,20)} 에이전트"]\n direction TB\n S${i}["${wrap(cut(sub.desc,60))}<br/>${sc||'작업 없음'}${sub.finished?'<br/>✔ 완료':''}"]:::agent\nend`);
      L.push(`${id} -.위임.-> S${i}`);
    }
    prev=id;
  });
  if(groups.length>MAX){ L.push(`MORE["… 이후 ${groups.length-MAX}단계 더"]:::other`); L.push(`${prev} --> MORE`); prev='MORE'; }
  const res = t.recap || t.reply;
  L.push(`E(["✅ 결과<br/>${wrap(cut(res||'(답변 없음)',160))}"]):::done`);
  L.push(`${prev} --> E`);
  return L.join('\n');
}

function sessionMermaid(s){
  const L=['flowchart TD', classDefs()];
  const skip = Math.max(0, s.turns.length-60), turns = s.turns.slice(skip);
  if(skip) L.push(`X["… 이전 요청 ${skip}개"]:::other`);
  turns.forEach((t,j)=>{
    const i=j+skip, c=counts(t.steps); const sc=ORDER.filter(k=>c[k]).map(k=>`${CATS[k].ico}${c[k]}`).join(' ');
    L.push(`T${i}(["요청 ${i+1} · ${wrap(cut(t.prompt,70),24)}"]):::start`);
    const res = t.recap||t.reply;
    L.push(`R${i}["${sc?sc+'<br/>':''}${wrap(cut(res||'',90),30)}"]:::${t.interrupted?'ask':'done'}`);
    L.push(`T${i} --> R${i}`);
    L.push(j ? `R${i-1} --> T${i}` : (skip ? `X --> T${i}` : ''));
  });
  return L.filter(Boolean).join('\n');
}

/* 아주 작은 Markdown 변환 (제목·목록·굵게·코드·mermaid) */
function md(src){
  const out=[]; let list=false, code=null, buf=[], table=null;
  const inline = t => h(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const cells = l => l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const close = () => { if(list){ out.push('</ul>'); list=false; }
    if(table){ out.push(`<div class="mdt"><table>${table.map((r,i)=>`<tr>${r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')}</tr>`).join('')}</table></div>`); table=null; } };
  for(const line of String(src).split('\n')){
    if(code!==null){
      if(/^```/.test(line)){ out.push(code==='mermaid' ? `<div class="mermaid-src">${h(buf.join('\n'))}</div>` : `<pre>${h(buf.join('\n'))}</pre>`); code=null; buf=[]; }
      else buf.push(line);
      continue;
    }
    const m = line.match(/^```\s*(\w*)/);
    if(m){ close(); code=m[1]||''; continue; }
    if(/^\s*\|.*\|\s*$/.test(line)){ if(list) { out.push('</ul>'); list=false; }
      if(/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue;   // 머리줄 아래 구분선
      (table ||= []).push(cells(line)); continue; }
    if(table) close();
    if(/^#{1,4}\s/.test(line)){ close(); out.push(`<h2>${inline(line.replace(/^#+\s*/,''))}</h2>`); }
    else if(/^\s*[-*]\s+/.test(line)){ if(!list){ out.push('<ul>'); list=true; } out.push(`<li>${inline(line.replace(/^\s*[-*]\s+/,''))}</li>`); }
    else if(line.trim()){ close(); out.push(`<p>${inline(line)}</p>`); }
    else close();
  }
  close();
  return out.join('');
}

let MODE='map', CB=null, CBSEL=null, CBRUN=null, CBRUND=null, CBNEW=false, CBTEAM=null, CBTNEW=false, JOBOPEN=null, cbKey='', apKey='', tmKey='';
const RST = {running:'일하는 중', waiting:'허락·답 기다림', done:'끝남', error:'오류', stopped:'멈춤', idle:'쉬는 중'};
const ENG = {claude:'Claude', codex:'ChatGPT(Codex)'};
const cbColor = name => css(botColorVar(name));
const botState = b => { const r = CB.runs.find(r=>r.bot===b.id); return r && ['running','waiting'].includes(r.status) ? r.status : 'idle'; };
const nowISO = () => new Date().toISOString();

function setMode(m){
  MODE=m; document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  $('#proj').hidden = m!=='map'; $('#gen').hidden = m!=='map';
  if(m==='map'){ if(DATA && DATA.projects) init(); } else loadCB(true);
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
if(!LIVE) $('#modes').hidden = true;

async function loadCB(force){
  try{ CB = await getJ('/bots'); }catch(e){ return; }
  renderApprovals();
  const n = CB.pending.length + CB.jobs.filter(j=>j.status==='wait').length; $('#pbadge').hidden=!n; $('#pbadge').textContent=n;
  if(MODE!=='bots') return;
  const key = JSON.stringify([CB.bots, CB.teams, CB.runs.map(r=>[r.id,r.status,r.steps,r.last&&r.last.t]), CB.jobs.map(j=>[j.id,j.status,j.stages.length])]);
  if(force){ cbKey=key; renderCBList(); renderCBMain(); }
  else if(key!==cbKey){ cbKey=key; renderCBList(); if(!CBRUN) renderCBDyn(); }
  if(CBRUN) loadRun();
}

/* 허락·질문 카드: 어느 화면에 있든 맨 위에 뜬다 */
function renderApprovals(){
  const key = CB.pending.map(p=>p.id).join(); if(key===apKey) return; apKey=key;
  $('#approvals').innerHTML = CB.pending.map(p=>{
    const c = CATS[p.cat]||CATS.other;
    return p.kind==='approve' ? `<div class="ap" data-id="${h(p.id)}">${botSVG(cbColor(p.bot))}
      <div><b>🙋 ${h(p.bot)} 봇이 허락을 구합니다</b><div class="what"><span class="chip" style="color:${col(p.cat||'other')}">${c.ico} ${c.ko}</span> <b>${h(p.tool)}</b> ${h(p.detail)}</div></div>
      <div class="row"><button class="okb" data-a="1">✅ 허락</button><button class="nob" data-a="0">✋ 거절</button></div>
      <details style="grid-column:2/-1"><summary class="sub">자세히 보기</summary><pre>${h(p.full)}</pre></details></div>`
    : `<div class="ap" data-id="${h(p.id)}">${botSVG(cbColor(p.bot))}
      <div><b>❓ ${h(p.bot)} 봇의 질문</b><div class="what">${h(p.question)}</div><textarea placeholder="답을 적어 주세요"></textarea></div>
      <div class="row"><button class="primary" data-a="t">💬 답하기</button></div></div>`;
  }).join('');
  $('#approvals').querySelectorAll('.ap').forEach(el=>el.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a, body={id:el.dataset.id, allow:a!=='0'};
    if(a==='t') body.text=el.querySelector('textarea').value;
    el.style.opacity=.4; await post('/bots/answer', body); apKey=null; loadCB();
  }));
}

function renderCBList(){
  const none = CBSEL===null && !CBNEW && !CBTEAM && !CBTNEW;
  let html = `<div class="scard ${none?'on':''}" data-b=""><b>🤝 전체 보기</b><small>팀 ${CB.teams.length}개 · 봇 ${CB.bots.length}명 · 최근 작업 ${CB.runs.length}개</small></div>`;
  html += `<div class="side-h">👥 팀</div>` + CB.teams.map(t=>{ const j=CB.jobs.find(x=>x.team===t.id), lead=CB.bots.find(b=>b.id===t.lead);
    const st = t.busy ? 'running' : j && j.status==='wait' ? 'waiting' : 'idle';
    return `<div class="bl tm st-${st} ${CBTEAM===t.id?'on':''}" data-t="${h(t.id)}" style="--bc:var(${botColorVar(lead?lead.name:'')})">${teamIcon(t)}
    <b>${h(t.name)} <span class="stt ${st}">${t.busy?'일하는 중':st==='waiting'?'판단 기다림':'쉬는 중'}</span></b><small>팀장 ${h(lead?lead.name:'?')} · 팀원 ${t.members.length}${t.queued?` · 대기 ${t.queued}`:''}${t.next?' · ⏰ '+fmt(t.next):''}</small></div>`; }).join('')
    + `<div class="row" style="margin-bottom:10px"><button id="newteam" style="flex:1">＋ 새 팀</button>${CB.teams.length?'':'<button id="exteam" style="flex:1">✨ 예시 팀 만들기</button>'}</div>`
    + `<div class="side-h">🤖 봇</div>`;
  html += CB.bots.map(b=>{ const st=botState(b), r=CB.runs.find(x=>x.bot===b.id);
    return `<div class="bl st-${st} ${CBSEL===b.id?'on':''}" data-b="${h(b.id)}" style="--bc:var(${botColorVar(b.name)})">${botSVG(cbColor(b.name))}
    <b>${h(b.name)} <span class="stt ${st}">${RST[st]}</span></b><small>${ENG[b.engine]} · ${b.next?'⏰ '+fmt(b.next):r?fmt(r.started):'아직 일 안 함'}</small></div>`; }).join('');
  html += `<button class="primary" id="newbot" style="width:100%;margin-top:4px">＋ 새 봇 만들기</button>`;
  $('#list').innerHTML = html;
  const pick = o => { CBSEL=null; CBNEW=false; CBTEAM=null; CBTNEW=false; CBRUN=null;
    if('CBSEL' in o) CBSEL=o.CBSEL; if(o.CBNEW) CBNEW=true; if(o.CBTEAM) CBTEAM=o.CBTEAM; if(o.CBTNEW) CBTNEW=true; renderCBList(); renderCBMain(); };
  $('#list').querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>pick({CBSEL: el.dataset.b||null}));
  $('#list').querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>pick({CBTEAM: el.dataset.t}));
  $('#newbot').onclick=()=>pick({CBNEW:true});
  $('#newteam').onclick=()=>pick({CBTNEW:true});
  if($('#exteam')) $('#exteam').onclick=async()=>{ const r=await post('/bots/team/example'); if(!r.ok) return alert(r.message); await loadCB(); pick({CBTEAM:r.team.id}); };
}

function renderCBMain(){
  if(CBRUN) return renderRun();
  if(CBTNEW || CBTEAM) return renderTeam();
  if(CBNEW){
    $('#main').innerHTML = `<h2>＋ 새 봇 만들기</h2><p style="color:var(--muted);margin-top:4px">봇은 이 PC에 로그인된 내 구독 계정(Claude 또는 ChatGPT)으로 일합니다. API 키는 쓰지 않습니다.</p>${botForm({})}`;
    return wireForm(null);
  }
  if(CBSEL===null){
    tmKey='';
    $('#main').innerHTML = `<h2>🤝 MyCollaboBot 팀</h2>
      <div class="engines">${Object.entries(CB.engines).map(([k,v])=>`<span class="src">${v.ready?'🟢':'⚪'} ${h(v.name)} ${v.ready?'연결됨':'로그인 필요 (⚙️ 설정)'}</span>`).join('')}</div>
      ${CB.bots.length?'':`<div class="empty" style="margin-top:20px">아직 봇이 없습니다. 왼쪽 아래 <b>＋ 새 봇 만들기</b>로 시작하세요.<br>예: ‘작가’(글 쓰기)와 ‘검토자’(읽기만, 평가)를 만들면, 작가가 검토자에게 일을 넘기며 함께 일합니다.</div>`}
      <h3>팀 지도 <span style="font-weight:400">누가 누구에게 일을 맡겼나 · 굵은 테두리는 지금 일하는 봇</span></h3><div id="teammap"></div>
      <h3>최근 작업</h3><div id="cbdyn"></div>`;
    return renderCBDyn();
  }
  const b = CB.bots.find(x=>x.id===CBSEL); if(!b){ CBSEL=null; return renderCBMain(); }
  $('#main').innerHTML = `<div class="bhead">${botSVG(cbColor(b.name))}<div><h2>${h(b.name)}</h2>
      <div class="sub" style="color:var(--muted)">${ENG[b.engine]} · ${h(CB.approval[b.approval])} · 📁 ${h(b.workdir)}</div>${b.role?`<div style="margin-top:4px">${h(b.role)}</div>`:''}</div></div>
    <div class="taskbox"><b>📝 일 맡기기</b><textarea id="task" placeholder="예: README를 읽고 처음 쓰는 사람을 위한 요약을 summary.md에 써 줘 (⌘/Ctrl+Enter로 보내기)"></textarea>
      <div class="row" style="margin-top:8px"><button class="primary" id="go">▶ 맡기기</button><span class="sub" id="gomsg"></span>${b.continue&&b.engine==='claude'?'<span class="sub">이전 대화를 이어서 기억합니다</span>':''}</div></div>
    <h3>${h(b.name)}의 작업</h3><div id="cbdyn"></div>
    <details class="cfg"><summary>⚙️ 봇 설정 · 예약 ${b.next?'(다음 예약 '+fmt(b.next)+')':''}</summary>${botForm(b)}</details>`;
  const go = async()=>{ const t=$('#task').value.trim(); if(!t) return; $('#go').disabled=true;
    const r = await post('/bots/start',{bot:b.id, task:t}); $('#go').disabled=false;
    if(!r.ok){ $('#gomsg').textContent='⚠ '+r.message; return; }
    $('#task').value=''; CBRUN=r.run; CBRUND=null; await loadCB(true); };
  $('#go').onclick = go;
  $('#task').onkeydown = e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) go(); };
  wireForm(b); renderCBDyn();
}

function runRow(r){
  const who = r.origin.startsWith('bot:') ? `↪ ${h(r.origin.slice(4))} → ` : r.origin.startsWith('team:') ? `👥 ${h(r.origin.slice(5))} · ` : r.origin==='schedule' ? '⏰ ' : '👤 ';
  const l = r.last && r.last.kind==='tool' ? `${(CATS[r.last.cat]||CATS.other).ico} ${h(r.last.tool)} ${h(r.last.detail||'')}` : '';
  return `<div class="rl" data-r="${h(r.id)}"><div class="q">${who}<span class="botb" style="--bc:var(${botColorVar(r.bot_name)})">🤖 ${h(r.bot_name)}</span>${h(r.task)}</div>
    <span class="stt ${r.status}">${RST[r.status]||r.status}</span><small>${fmt(r.started)} · ${dur(r.started, r.ended||nowISO())||'방금'} ${l?'· '+l:''}</small><span></span>${bar(r.steps||{})}</div>`;
}
function renderCBDyn(){
  const el=$('#cbdyn'); if(!el) return;
  const runs = CBSEL ? CB.runs.filter(r=>r.bot===CBSEL) : CB.runs;
  if(CBTEAM) return renderJobs();
  el.innerHTML = runs.length ? runs.slice(0,30).map(runRow).join('') : '<div class="empty">아직 작업이 없습니다.</div>';
  el.querySelectorAll('.rl').forEach(x=>x.onclick=()=>{ CBRUN=x.dataset.r; CBRUND=null; renderRun(); loadRun(); });
  if($('#teammap')) drawTeamMap();
}
function drawTeamMap(){
  if(!CB.bots.length){ $('#teammap').innerHTML=''; return; }
  const idx = Object.fromEntries(CB.bots.map((b,i)=>[b.name,'b'+i])), edges={};
  CB.runs.forEach(r=>{ const to=idx[r.bot_name]; const from = r.origin.startsWith('bot:') ? idx[r.origin.slice(4)] : r.origin==='schedule' ? 'C' : 'U';
    if(to && from) edges[from+'>'+to]=(edges[from+'>'+to]||0)+1; });
  CB.bots.forEach(b=>{ const s=b.schedule||{}; if(s.kind && s.kind!=='off' && s.task) edges['C>'+idx[b.name]] ||= 0; });
  const lines=['flowchart LR','U(["👤 나"])'];
  if(Object.keys(edges).some(k=>k.startsWith('C>'))) lines.push('C{{"⏰ 예약"}}');
  CB.bots.forEach((b,i)=>{ const st=botState(b), c=cbColor(b.name);
    lines.push(`b${i}["🤖 ${esc(b.name)}<br/>${st==='idle'?ENG[b.engine]:RST[st]}"]`, `style b${i} fill:${c}22,stroke:${c},stroke-width:${st==='idle'?2:5}px`); });
  Object.entries(edges).forEach(([k,n])=>{ const [a,b]=k.split('>'); lines.push(n ? `${a} -->|${n}번| ${b}` : `${a} -.-> ${b}`); });
  const code=lines.join('\n'); if(code===tmKey) return; tmKey=code;
  drawMermaid($('#teammap'), code, 'team');
}

async function loadRun(){
  if(!CBRUN) return;
  const r = await getJ('/bots/run?id='+encodeURIComponent(CBRUN)).catch(()=>null);
  if(!r || r.id!==CBRUN) return;
  r._k = JSON.stringify([r.status, r.events.length, r.events.map(e=>e.answer?1:0).join(''), r.result.length, r.children]);
  if(CBRUND && CBRUND.id===r.id && CBRUND._k===r._k) return;
  CBRUND=r; if(MODE==='bots') renderRun();
}
function renderRun(){
  const lite = CB && CB.runs.find(x=>x.id===CBRUN);
  const r = CBRUND && CBRUND.id===CBRUN ? CBRUND : lite ? {...lite, events:[]} : null;
  if(!r){ $('#main').innerHTML='<div class="empty"><span class="spin"></span></div>'; return; }
  const live = ['running','waiting'].includes(r.status), parent = r.parent && CB.runs.find(x=>x.id===r.parent);
  const tiles = [r.origin.startsWith('team:') ? `<div class="tk user"><b>👥 ${h(r.origin.slice(5))}</b><span>팀장으로 일함</span></div>` : r.origin.startsWith('bot:') ? `<div class="tk user" style="--cc:var(${botColorVar(r.origin.slice(4))})"><b>🤖 ${h(r.origin.slice(4))}</b><span>일을 맡김</span></div>`
    : r.origin==='schedule' ? `<div class="tk user"><b>⏰ 예약</b><span>${fmt(r.started)}</span></div>` : `<div class="tk user"><b>👤 나</b><span>${fmt(r.started)}</span></div>`];
  const evs = r.events.filter(e=>e.kind!=='end');
  evs.forEach((e,i)=>{
    const now = live && i===evs.length-1 ? ' now' : '';
    if(e.kind==='tool'){ const c=CATS[e.cat]||CATS.other; tiles.push(`<div class="tk${e.error?' err':''}${now}" style="--cc:${col(CATS[e.cat]?e.cat:'other')}" title="${h(e.detail)}"><b>${c.ico} ${h(e.tool)}</b><span>${h(e.detail||c.ko)}</span></div>`); }
    else if(e.kind==='approve'){ const a=e.answer; tiles.push(`<div class="tk ap${a&&a.allow?' ok':''}${now}" style="--cc:var(--c-ask)" title="${h(e.detail)}"><span class="ans">${!a?'⏳':a.allow?'✅':'✋'}</span><b>🙋 허락 · ${h(e.tool)}</b><span>${h(e.detail)}</span></div>`); }
    else if(e.kind==='ask'){ const a=e.answer; tiles.push(`<div class="tk ap${a?' ok':''}${now}" style="--cc:var(--c-ask)" title="${h(e.question)}"><span class="ans">${a?'💬':'⏳'}</span><b>❓ 질문</b><span>${h(a?a.text:e.question)}</span></div>`); }
    else if(e.kind==='handoff'){ tiles.push(`<div class="tk hand${now}" data-r="${h(e.child)}" style="--cc:var(${botColorVar(e.to)})" title="${h(e.text)}">${botSVG(cbColor(e.to))}<div><b>→ ${h(e.to)}에게 맡김</b><span>${h(e.text)}</span></div></div>`); }
    else if(e.kind==='text'){ tiles.push(`<div class="tk say${now}" title="${h(e.text)}"><b>💬 생각·말</b><span>${h(e.text)}</span></div>`); }
  });
  const END = {done:['✅ 끝','--c-plan'], error:['❌ 오류','--err'], stopped:['⏹ 멈춤','--muted']}[r.status];
  tiles.push(END ? `<div class="tk end" style="--cc:var(${END[1]})">${END[0]}</div>` : `<div class="tk end now" style="--cc:var(--accent)"><span class="spin"></span> ${RST[r.status]}</div>`);
  $('#main').innerHTML = `<div class="row"><button id="back">← ${h(r.job&&CB.jobs.find(x=>x.id===r.job)?CB.jobs.find(x=>x.id===r.job).team_name:r.bot_name)}</button>${parent?`<button id="up">↑ 맡긴 작업 (${h(parent.bot_name)})</button>`:''}${live?'<button class="nob" id="stop">⏹ 멈추기</button>':''}</div>
    <div class="bhead" style="margin-top:12px">${botSVG(cbColor(r.bot_name))}<div><h2 style="white-space:pre-wrap;word-break:break-word">${h(r.task.length>160?r.task.slice(0,160)+'…':r.task)}</h2>
      <div class="sub" style="color:var(--muted)"><span class="stt ${r.status}">${RST[r.status]}</span> ${h(r.bot_name)} · ${ENG[r.engine]} · ${fmt(r.started)} · ${dur(r.started, r.ended||nowISO())||'방금'}</div></div></div>
    ${chips(r.steps||{}, r.events.filter(e=>e.kind==='tool'))}
    <h3>진행 흐름 <span style="font-weight:400">${live?'실시간 · ':''}🙋 허락 ✅허락함 ✋거절함 · 봇 그림은 다른 봇에게 맡긴 일(누르면 열림)</span></h3>
    <div class="track">${tiles.join('<span class="tka">→</span>')}</div>
    ${r.result||r.error?`<div class="result ${r.status==='error'?'bad':''}"><b>${r.status==='error'?'⚠ 오류':'📄 결과'}</b><div class="md">${md(r.result||r.error)}</div></div>`:''}`;
  $('#back').onclick=()=>{ CBRUN=null; CBRUND=null; const j=r.job&&CB.jobs.find(x=>x.id===r.job); if(j){ CBTEAM=j.team; CBSEL=null; JOBOPEN=j.id; } else CBSEL=r.bot; renderCBList(); renderCBMain(); };
  if($('#up')) $('#up').onclick=()=>{ CBRUN=parent.id; CBRUND=null; renderRun(); loadRun(); };
  if($('#stop')) $('#stop').onclick=async()=>{ await post('/bots/stop',{run:r.id}); loadCB(); };
  $('#main').querySelectorAll('.tk.hand[data-r]').forEach(x=>x.onclick=()=>{ CBRUN=x.dataset.r; CBRUND=null; renderRun(); loadRun(); });
}

/* ── 팀: 팀장이 알아서 나눠 맡기고 검토 → 최종 결과를 내가 승인·수정 요청 ── */
const JST = {queued:['⏳','기다리는 중'], running:['🔄','진행 중'], wait:['🧑‍⚖️','판단 기다림'], approved:['✅','승인함'], revise:['✍️','수정 요청함'], stopped:['⏹','멈춤'], error:['⚠️','문제 있음']};
const teamIcon = t => `<div class="ticon">👥<i>${t.members.length+1}</i></div>`;

function renderTeam(){
  if(CBTNEW){
    $('#main').innerHTML = `<h2>＋ 새 팀 만들기</h2><p style="color:var(--muted);margin-top:4px">팀에 일을 던지면 팀장 봇이 팀원에게 나눠 맡기고(한 번에 최대 ${CB.max.tasks}개, 동시에), 결과를 검토해 부족하면 다시 맡긴 뒤(최대 ${CB.max.rounds}차) 최종 결과를 냅니다. 나는 최종 결과를 <b>승인</b>하거나 <b>수정 요청</b>만 합니다.</p>${teamForm({})}`;
    return wireTeamForm(null);
  }
  const t = CB.teams.find(x=>x.id===CBTEAM); if(!t){ CBTEAM=null; return renderCBMain(); }
  const lead = CB.bots.find(b=>b.id===t.lead), mem = t.members.map(id=>CB.bots.find(b=>b.id===id)).filter(Boolean);
  const av = (b,isLead) => `<div class="av ${isLead?'lead':''}" style="--bc:var(${botColorVar(b.name)})">${botSVG(cbColor(b.name))}<b>${h(b.name)}</b><small>${isLead?'팀장':h(cut(b.role,22))||'팀원'}</small></div>`;
  $('#main').innerHTML = `<h2>👥 ${h(t.name)}</h2>
    <div class="avs">${lead?av(lead,true):''}<span class="tka">⇢</span>${mem.map(b=>av(b)).join('') || '<span class="sub">정해 둔 팀원 없음 · 필요하면 팀장이 임시 팀원을 만듭니다</span>'}</div>
    <div class="taskbox"><b>📝 팀에 일 던지기</b> <span class="sub">팀장이 알아서 나눠 맡기고 검토해 최종 결과를 냅니다. 되묻지 않고 가정을 밝히며 진행합니다.</span>
      <textarea id="ttask" placeholder="예: 다음 주 팀 회의 안건을 정리하고, 안건마다 필요한 자료와 결정할 점을 표로 만들어 줘 (⌘/Ctrl+Enter로 보내기)"></textarea>
      <div class="row" style="margin-top:8px"><button class="primary" id="tgo">▶ 보내기</button><span class="sub" id="tmsg">${t.busy?'지금 일하는 중입니다. 보낸 일은 끝난 뒤 이어서 합니다.':''}</span>${CB.docs?'<span class="sub">📚 내 문서 검색 연결됨</span>':''}</div></div>
    <h3>진행 상황 <span style="font-weight:400">상자를 누르면 그 봇이 한 일이 열립니다</span></h3><div id="cbdyn"></div>
    <details class="cfg"><summary>⚙️ 팀 설정 · 예약 ${t.next?'(다음 예약 '+fmt(t.next)+')':''}</summary>${teamForm(t)}</details>`;
  const go = async()=>{ const x=$('#ttask').value.trim(); if(!x) return; $('#tgo').disabled=true;
    const r = await post('/bots/team/send',{team:t.id, text:x}); $('#tgo').disabled=false;
    if(!r.ok){ $('#tmsg').textContent='⚠ '+r.message; return; }
    $('#ttask').value=''; JOBOPEN=r.job; await loadCB(true); };
  $('#tgo').onclick = go;
  $('#ttask').onkeydown = e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) go(); };
  wireTeamForm(t); renderJobs();
}

function renderJobs(){
  const el=$('#cbdyn'); if(!el) return;
  const a=document.activeElement; if(a && a.tagName==='TEXTAREA' && el.contains(a)) return;   // 수정 의견을 쓰는 중에는 다시 그리지 않는다
  const jobs = CB.jobs.filter(j=>j.team===CBTEAM);
  if(!jobs.length){ el.innerHTML='<div class="empty">아직 맡긴 일이 없습니다.</div>'; return; }
  const open = JOBOPEN && jobs.some(j=>j.id===JOBOPEN) ? JOBOPEN : jobs[0].id;
  el.innerHTML = jobs.slice(0,20).map(j=> j.id===open ? jobCard(j)
    : `<div class="rl" data-j="${h(j.id)}"><div class="q">${j.trigger==='schedule'?'⏰ ':'👤 '}${h(j.text)}</div><span class="stt js-${j.status}">${JST[j.status].join(' ')}</span><small>${fmt(j.started)} · 단계 ${j.stages.length}개</small></div>`).join('');
  el.querySelectorAll('.rl[data-j]').forEach(x=>x.onclick=()=>{ JOBOPEN=x.dataset.j; renderJobs(); });
  el.querySelectorAll('.sbox[data-r]').forEach(x=>x.onclick=()=>{ if(!x.dataset.r) return; CBRUN=x.dataset.r; CBRUND=null; renderRun(); loadRun(); });
  const card = el.querySelector('.job'); if(!card) return;
  const jid = card.dataset.job;
  const q = s => card.querySelector(s);
  if(q('.jstop')) q('.jstop').onclick = async()=>{ await post('/bots/team/stop',{job:jid}); loadCB(); };
  if(q('.japp')) q('.japp').onclick = async()=>{ const r=await post('/bots/team/decide',{job:jid, verdict:'approve'}); if(!r.ok) alert(r.message); loadCB(); };
  if(q('.jrev')) q('.jrev').onclick = ()=>{ q('.revbox').hidden=false; q('.revbox textarea').focus(); };
  if(q('.jrevgo')) q('.jrevgo').onclick = async()=>{ const note=q('.revbox textarea').value.trim(); if(!note) return;
    const r=await post('/bots/team/decide',{job:jid, verdict:'revise', note}); if(!r.ok) return alert(r.message);
    document.activeElement.blur(); JOBOPEN=null; loadCB(); };
}

function stageBox(st){
  const r = st.run && CB.runs.find(x=>x.id===st.run);
  const s2 = st.ended || !r ? st.status : r.status, live = ['running','waiting'].includes(s2);
  const cv = st.temp ? '--c-other' : botColorVar(st.bot_name);
  const label = {plan:'📋 계획', review:`🔍 ${st.round}차 검토`}[st.step];
  const tools = r ? Object.values(r.steps||{}).reduce((a,b)=>a+b,0) : 0;
  const lt = r && r.last && r.last.kind==='tool' ? `${(CATS[r.last.cat]||CATS.other).ico} ${r.last.tool} ${r.last.detail||''}` : '';
  const what = st.step==='task' ? st.task : (live ? '' : st.text);
  return `<div class="sbox ${live?'now':''} ss-${s2}" data-r="${h(st.run||'')}" style="--bc:var(${cv})" title="${h(st.task)}">
    ${botSVG(css(cv))}<div><b>${label?label+' · ':''}${st.temp?'🧩 ':''}${h(st.bot_name)}</b>
    ${what?`<span>${h(cut(what,70))}</span>`:''}
    <small><i class="sd"></i>${RST[s2]||s2} · ${dur(st.started, st.ended||nowISO())||'방금'}${tools?` · 도구 ${tools}`:''}${live&&lt?' · '+h(cut(lt,36)):''}</small></div></div>`;
}

function jobCard(j){
  const live = ['running','queued'].includes(j.status);
  const groups = [];
  j.stages.forEach(st=>{ const g=groups[groups.length-1];
    if(st.step==='task'){ if(g && g.tasks && g.round===st.round) g.tasks.push(st); else groups.push({round:st.round, tasks:[st]}); }
    else groups.push({one:st}); });
  const flow = [`<div class="sg"><div class="tk user"><b>${j.trigger==='schedule'?'⏰ 예약':'👤 나'}</b><span>${h(cut(j.text,40))}</span></div></div>`]
    .concat(groups.map(g=> g.tasks ? `<div class="sg col"><div class="sgh">${g.round}차 · 팀원 ${g.tasks.length}명 동시에</div>${g.tasks.map(stageBox).join('')}</div>` : `<div class="sg">${stageBox(g.one)}</div>`));
  flow.push(['wait','approved','revise'].includes(j.status) ? `<div class="sg"><div class="tk end" style="--cc:var(--c-plan)">🏁 최종 결과</div></div>`
    : live ? `<div class="sg"><div class="tk end now" style="--cc:var(--accent)"><span class="spin"></span> ${JST[j.status][1]}</div></div>`
    : `<div class="sg"><div class="tk end" style="--cc:var(--err)">${JST[j.status].join(' ')}</div></div>`);
  return `<div class="job" data-job="${h(j.id)}">
    <div class="jh"><span class="stt js-${j.status}">${JST[j.status].join(' ')}</span><b>${h(j.text.length>200?j.text.slice(0,200)+'…':j.text)}</b>
      <small>${fmt(j.started)} · ${dur(j.started, j.ended||nowISO())||'방금'}</small>${live?'<button class="nob jstop">⏹ 멈추기</button>':''}</div>
    <div class="jflow">${flow.join('<span class="tka">→</span>')}</div>
    ${j.final?`<div class="result"><b>🏁 최종 결과</b><div class="md">${md(j.final)}</div>${decideHTML(j)}</div>`:''}
    ${j.error?`<div class="result bad"><b>⚠ 문제</b><div>${h(j.error)}</div></div>`:''}
  </div>`;
}
function decideHTML(j){
  if(j.status==='approved') return `<div class="dec okd">✅ 승인함 · ${fmt(j.decided)}</div>`;
  if(j.status==='revise') return `<div class="dec">✍️ 수정 요청함: ${h(j.note)}</div>`;
  if(j.status!=='wait') return '';
  return `<div class="dec"><b>🧑‍⚖️ 판단해 주세요</b><button class="okb japp">✅ 승인</button><button class="jrev">✍️ 수정 요청</button>
    <div class="revbox" hidden><textarea placeholder="무엇을 고칠지 적어 주세요. 팀장이 이 의견대로 이어서 고칩니다."></textarea><button class="primary jrevgo">보내기</button></div></div>`;
}

function teamForm(t){
  const s = t.schedule || {kind:'off', time:'09:00', minutes:60, task:''};
  const opt = (v,cur,l) => `<option value="${h(v)}" ${v===cur?'selected':''}>${h(l)}</option>`;
  return `<div class="form" id="tform">
    <label>이름</label><input class="f" name="name" value="${h(t.name||'')}" placeholder="예: 문서 팀">
    <label>팀장</label><select class="f" name="lead">${CB.bots.map(b=>opt(b.id,t.lead,`${b.name} · ${ENG[b.engine]}`)).join('') || '<option value="">먼저 봇을 만드세요</option>'}</select>
    <label>팀원</label><div class="mems">${CB.bots.map(b=>`<label class="mem" style="--bc:var(${botColorVar(b.name)})"><input type="checkbox" value="${h(b.id)}" ${(t.members||[]).includes(b.id)?'checked':''}> 🤖 ${h(b.name)}</label>`).join('') || '<span class="sub">먼저 봇을 만드세요</span>'}</div>
    <span class="hint">팀원은 정하지 않아도 됩니다. 맞는 팀원이 없으면 팀장이 이번 일에만 쓰는 임시 팀원(🧩, 읽기만)을 만듭니다. 한 봇이 여러 팀에 들어갈 수 있습니다.</span>
    <label>예약</label><div class="row"><select class="f" name="kind" style="width:auto">${opt('off',s.kind,'안 함')}${opt('daily',s.kind,'매일')}${opt('weekdays',s.kind,'평일')}${opt('interval',s.kind,'N분마다')}</select>
      <input class="f" type="time" name="time" value="${h(s.time)}" style="width:auto"><span id="tminwrap"><input class="f" type="number" name="minutes" min="10" value="${+s.minutes||60}" style="width:90px"> 분마다</span></div>
    <label>예약할 일</label><textarea name="stask" placeholder="예: 이번 주 바뀐 문서를 살펴보고 주간 보고 초안을 만들어 줘">${h(s.task||'')}</textarea>
    <span></span><div class="row"><button class="primary" id="tsave">💾 저장</button>${t.id?'<button class="nob" id="tdel">🗑 팀 지우기</button>':''}<span class="sub" id="tfmsg"></span></div>
  </div>`;
}
function wireTeamForm(t){
  const f=$('#tform'), v=n=>f.querySelector(`[name=${n}]`);
  const sync=()=>{ const k=v('kind').value; v('time').hidden=!['daily','weekdays'].includes(k); $('#tminwrap').hidden=k!=='interval'; };
  v('kind').onchange=sync; sync();
  $('#tsave').onclick=async()=>{
    const body={id:t&&t.id, name:v('name').value, lead:v('lead').value, members:[...f.querySelectorAll('.mems input:checked')].map(x=>x.value),
      schedule:{kind:v('kind').value, time:v('time').value, minutes:+v('minutes').value, task:v('stask').value}};
    const r=await post('/bots/team/save', body); if(!r.ok){ $('#tfmsg').textContent='⚠ '+r.message; return; }
    CBTNEW=false; CBTEAM=r.team.id; await loadCB(true); };
  if($('#tdel')) $('#tdel').onclick=async()=>{ if(!confirm(`${t.name} 팀을 지울까요? 봇과 지난 작업 기록은 남습니다.`)) return;
    const r=await post('/bots/team/delete',{id:t.id}); if(!r.ok) return alert(r.message); CBTEAM=null; await loadCB(true); };
}

function botForm(b){
  const s = b.schedule || {kind:'off', time:'09:00', minutes:60, task:''};
  const opt = (v,cur,l) => `<option value="${v}" ${v===cur?'selected':''}>${h(l)}</option>`;
  return `<div class="form" id="bform">
    <label>이름</label><input class="f" name="name" value="${h(b.name||'')}" placeholder="예: 작가">
    <label>역할</label><textarea name="role" placeholder="이 봇이 맡는 일. 예: 블로그 글 초안을 쓴다. 다 쓰면 검토자 봇에게 평가를 받는다.">${h(b.role||'')}</textarea>
    <label>AI</label><select class="f" name="engine">${Object.entries(CB.engines).map(([k,v])=>opt(k,b.engine||'claude',v.name+(v.ready?'':' — 로그인 필요'))).join('')}</select>
    <label>허락 방식</label><select class="f" name="approval">${Object.entries(CB.approval).map(([k,v])=>opt(k,b.approval||'ask',v)).join('')}</select>
    <span class="hint">ChatGPT(Codex) 봇은 허락을 묻지 않고 작업 폴더 안에서만 고칩니다. ‘읽기만’이면 아무것도 고치지 못합니다.</span>
    <label>작업 폴더</label><input class="f" name="workdir" value="${h(b.workdir||'')}" placeholder="비우면 봇 전용 폴더 (~/.ai-work-map/bots/<이름>/work)">
    <label>기억</label><label style="color:var(--ink)"><input type="checkbox" name="continue" ${b.continue!==false?'checked':''}> 이전 대화를 이어서 기억하기 (Claude 봇)</label>
    <label>예약</label><div class="row"><select class="f" name="kind" style="width:auto">${opt('off',s.kind,'안 함')}${opt('daily',s.kind,'매일')}${opt('weekdays',s.kind,'평일')}${opt('interval',s.kind,'N분마다')}</select>
      <input class="f" type="time" name="time" value="${h(s.time)}" style="width:auto"><span id="minwrap"><input class="f" type="number" name="minutes" min="10" value="${+s.minutes||60}" style="width:90px"> 분마다</span></div>
    <label>예약할 일</label><textarea name="stask" placeholder="예: 어제 바뀐 파일을 살펴보고 요약을 daily.md에 덧붙여">${h(s.task||'')}</textarea>
    <span></span><div class="row"><button class="primary" id="bsave">💾 저장</button>${b.id?'<button class="nob" id="bdel">🗑 봇 지우기</button>':''}<span class="sub" id="bmsg"></span></div>
  </div>`;
}
function wireForm(b){
  const f=$('#bform'), v=n=>f.querySelector(`[name=${n}]`);
  const sync=()=>{ const k=v('kind').value; v('time').hidden=!['daily','weekdays'].includes(k); $('#minwrap').hidden=k!=='interval'; };
  v('kind').onchange=sync; sync();
  $('#bsave').onclick=async()=>{
    const body={id:b&&b.id, name:v('name').value, role:v('role').value, engine:v('engine').value, approval:v('approval').value, workdir:v('workdir').value,
      continue:v('continue').checked, schedule:{kind:v('kind').value, time:v('time').value, minutes:+v('minutes').value, task:v('stask').value}};
    const r=await post('/bots/save', body); if(!r.ok){ $('#bmsg').textContent='⚠ '+r.message; return; }
    CBNEW=false; CBSEL=r.bot.id; await loadCB(true); };
  if($('#bdel')) $('#bdel').onclick=async()=>{ if(!confirm(`${b.name} 봇을 지울까요? 작업 폴더와 지난 작업 기록은 남습니다.`)) return;
    await post('/bots/delete',{id:b.id}); CBSEL=null; await loadCB(true); };
}

if(LIVE){ loadUpdate(); setInterval(loadUpdate, 60000); }
if(LIVE){ loadCB(); setInterval(()=>loadCB().catch(()=>{}), 2000); }
if(LIVE){ refresh(true).catch(e=>$('#main').innerHTML='<div class="empty">서버에 연결할 수 없습니다.</div>'); setInterval(()=>refresh(false).catch(()=>{}), 3000); }
else init();
</script>
</body>
</html>
